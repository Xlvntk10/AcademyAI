<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Academy AI" />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/academy.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Academy AI — маленькие шаги к большим знаниям. Английский, технологии и твой учебный прогресс." />
    <title>Academy AI — твоё пространство знаний</title>
    <script>
      try {
        const saved = localStorage.getItem('academy-theme');
        document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"><section class="boot-fallback" role="status">
      <h1>Academy AI</h1><p id="boot-message">Открываем твоё учебное пространство…</p>
      <p id="boot-help" hidden>Если запуск остановился, подключись к домашнему серверу и повтори открытие. Локальные ответы хранятся отдельно. Сохрани данные сайта при восстановлении.</p>
      <a href="/" id="boot-retry" hidden>Повторить запуск</a>
      <noscript>Для открытия учебной библиотеки включи JavaScript в настройках браузера.</noscript>
    </section></div>
    <style>
      .boot-fallback{font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:540px;margin:12vh auto;padding:28px;border:1px solid #dbe3d7;border-radius:20px;background:#f7f8fa;color:#252c29}
      .boot-fallback a{color:#456c43}.boot-fallback h1{font-size:28px}
      @media(prefers-color-scheme:dark){.boot-fallback{background:#1d2420;color:#edf2e9;border-color:#303b33}.boot-fallback a{color:#b3d69b}}
    </style>
    <script>
      window.setTimeout(function () {
        const message = document.getElementById('boot-message');
        if (!message) return;
        message.textContent = 'Не удалось полностью загрузить приложение.';
        document.getElementById('boot-help').hidden = false;
        document.getElementById('boot-retry').hidden = false;
      }, 6000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
