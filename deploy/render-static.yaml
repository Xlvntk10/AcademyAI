# Static-only alternative to the combined root Blueprint. Do not deploy both.
services:
  - type: web
    name: academy-ai-web
    runtime: static
    branch: feature/academy-ai-v2
    autoDeployTrigger: 'off'
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_ACCOUNT_MODE
        value: supabase
    routes:
      # Replace this host with the actual public API URL before deploying.
      # Do not redirect: POST, cookies and concurrency headers must be proxied.
      - type: rewrite
        source: /api/*
        destination: https://REPLACE-API-HOST.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Conservative public caching; the service worker stores the offline shell.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /api/*
        name: Cache-Control
        value: private, no-store
      - path: /api/*
        name: CDN-Cache-Control
        value: no-store
      - path: /auth/callback
        name: Cache-Control
        value: no-store
      - path: /auth/callback
        name: CDN-Cache-Control
        value: no-store
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
