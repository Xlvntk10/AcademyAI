# Optional split hosting. Replace academy-ai.onrender.com with your actual API.
# Verify POST forwarding, Set-Cookie, no-store and cookie replay on Render first.
# The API's ACADEMY_PUBLIC_ORIGIN must be this static site's HTTPS origin.
services:
  - type: web
    name: academy-ai-static
    runtime: static
    branch: feature/academy-ai-v2
    autoDeployTrigger: 'off'
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_ACCOUNT_MODE
        value: supabase
    routes:
      - type: rewrite
        source: /api/*
        destination: https://academy-ai.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /api/*
        name: Cache-Control
        value: no-store
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
